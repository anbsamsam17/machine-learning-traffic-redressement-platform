name: CI

# Continuous Integration: lint + tests on every push and pull request.
# This is what the README's CI badge tracks. Building/pushing images and
# deploying live in a separate workflow (deploy.yml) so a deployment issue
# never turns this badge red.
on: [push, pull_request]

jobs:
  lint-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff black mypy
      - run: ruff check apps/api/
      - run: black --check apps/api/

  lint-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # Monorepo npm workspaces: the lockfile lives at the repo root.
      - run: npm ci
      - run: cd apps/web && npm run lint

  test-backend:
    runs-on: ubuntu-latest
    needs: lint-backend
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # [dev,prod] : prod carries tensorflow-cpu/keras — required by the ML
      # tests (test_losses, test_kfold, test_model_builder, …) to collect.
      - run: cd apps/api && pip install ".[dev,prod]"
      - run: cd apps/api && pytest tests/ -v --tb=short --timeout=120 --cov=app --cov-report=term-missing
        env:
          REDIS_URL: redis://localhost:6379/0
          # 32+ chars, does not contain "change-me" (satisfies the config.py validator)
          JWT_SECRET: ci-test-secret-key-for-pytest-not-prod-do-not-reuse-1234567890
